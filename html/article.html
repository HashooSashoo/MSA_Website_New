<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article - Rice Muslim Student Association</title>
    <link rel="stylesheet" href="../css/styles-new.css">
    <link rel="icon" href="../image_files/icons8-masjid-50.png" type="image/png">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <!-- Header -->
    <header>
        <div class="header-container">
            <!-- Logo -->
            <img src="../image_files/LOGOS - 1.png" alt="MSA Logo" class="header-logo" onclick="window.location.href='../index.html'">

            <!-- Navigation Links -->
            <ul class="nav-links" id="navLinks">
                <li><a href="events.html">Events</a></li>
                <li><a href="prayer-times.html">Prayer Times</a></li>
                <li><a href="resources.html">Resources</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="get-connected.html">Get Connected</a></li>
            </ul>

            <!-- Prayer Times Widget -->
            <div class="prayer-times-header" onclick="window.location.href='prayer-times.html'">
                <div class="mosque-icon">
                    <img src="../image_files/icons8-masjid-50.png" alt="Mosque" style="width: 24px; height: 24px;">
                </div>
                <div class="prayer-item">
                    <span class="prayer-name">Fajr</span>
                    <span class="prayer-time">6<span class="colon">:</span>56 AM</span>
                </div>
                <div class="prayer-item">
                    <span class="prayer-name">Dhuhr</span>
                    <span class="prayer-time">12<span class="colon">:</span>44 PM</span>
                </div>
                <div class="prayer-item">
                    <span class="prayer-name">Asr</span>
                    <span class="prayer-time">3<span class="colon">:</span>09 PM</span>
                </div>
                <div class="prayer-item">
                    <span class="prayer-name">Maghrib</span>
                    <span class="prayer-time">5<span class="colon">:</span>38 PM</span>
                </div>
                <div class="prayer-item">
                    <span class="prayer-name">Isha</span>
                    <span class="prayer-time">6<span class="colon">:</span>50 PM</span>
                </div>
                <div class="prayer-item jummah-item">
                    <span class="prayer-name">Jummah</span>
                    <span class="prayer-time">1<span class="colon">:</span>00 PM</span>
                    <span class="prayer-time">2<span class="colon">:</span>00 PM</span>
                </div>
            </div>

            <!-- Header Buttons -->
            <div class="header-buttons">
                <a href="contact.html" class="btn-contact">Contact Us</a>
                <a href="donations.html" class="btn-donate">Donate</a>
            </div>

            <!-- Dark Mode Toggle -->
            <div class="dark-mode-toggle" id="darkModeToggle">
                <div class="toggle-circle"></div>
            </div>

            <!-- Mobile Menu Icon -->
            <img src="../image_files/settings.png" alt="Menu" class="menu-icon" id="menuIcon">
        </div>
    </header>

    <!-- Article Section -->
    <section class="article-section">
        <div class="container">
            <a href="resources.html" class="article-back-link">&larr; Back to Resources</a>

            <div class="article-header">
                <h1 class="article-title" id="articleTitle"></h1>
                <div class="article-meta">
                    <span class="article-author" id="articleAuthor"></span>
                    <span class="article-date" id="articleDate"></span>
                </div>
            </div>

            <div class="article-image" id="articleImage"></div>

            <div class="article-body" id="articleBody">
                <p class="article-loading">Loading article...</p>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="footer-container">
            <img src="../image_files/Rice_University_Horizontal_Blue.png" alt="Rice University" class="footer-logo">
            <p class="footer-text">© Rice Muslim Student Association. All rights reserved.</p>
            <a href="sitemap.html" class="footer-sitemap">Site Map</a>
            <div class="social-icons">
                <a href="#" class="social-icon" aria-label="YouTube">
                    <img src="../image_files/youtubelogo.webp" alt="YouTube">
                </a>
                <a href="#" class="social-icon" aria-label="Instagram">
                    <img src="../image_files/instagramlogo.webp" alt="Instagram">
                </a>
                <a href="#" class="social-icon" aria-label="GroupMe">
                    <img src="../image_files/gourpmelogo.webp" alt="GroupMe">
                </a>
                <a href="#" class="social-icon" aria-label="Listserv">
                    <img src="../image_files/listserv.webp" alt="Listserv">
                </a>
                <a href="#" class="social-icon" aria-label="Facebook">
                    <img src="../image_files/facebooklogo.webp" alt="Facebook">
                </a>
            </div>
        </div>
    </footer>

    <script src="../js/script-new.js"></script>
    <script src="../js/prayer-times-header.js"></script>
    <script src="../js/article.js"></script>
</body>
</html>
